# Install once with `pre-commit install`; run everything with `pre-commit run --all-files`.
# mypy is deliberately not a hook here: it is slow and needs the project's
# dependencies installed, so it runs in CI and by hand (`uv run mypy`).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
