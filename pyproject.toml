[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sable"
version = "0.9"
description = "A Nextcloud Talk assistant that runs as a user account: command handling, an OpenAI-compatible LLM assistant, and an inbound alerting endpoint."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
sable = "sable.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sable"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:sable.*"]

