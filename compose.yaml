# sable — a Nextcloud Talk bot.  Full reference: docs/configuration.md
#
# There are two places to put settings, and they stack:
#
#   1. a .env file next to this one — optional, loaded below, and the right home
#      for secrets, since this file is meant to be committed;
#   2. the environment: block below, which OVERRIDES anything from .env.
#
# Only SABLE_BOT_SECRET is required. Every other variable is listed, commented
# out, showing its default — uncomment to change it.
#
# Quote every value. Compose coerces plain scalars to strings, but YAML itself
# would read {} as an empty mapping and treat a leading ! as a type tag — which
# is a parse error, and the default command prefix is exactly that.

services:
  sable:
    # Build from this checkout. To run a published release instead, delete these
    # two lines and use the image CI built (see docs/releasing.md):
    #   image: forgejo.subversive.link/subversive/sable:0.6
    build: .
    image: sable:latest
    container_name: sable
    restart: unless-stopped

    env_file:
      - path: .env
        required: false

    volumes:
      # ===================== TLS trust ====================================
      # The host's CA directory, read-only, so the bot can verify a Nextcloud
      # using an internal or self-signed certificate. This works because your
      # host already trusts that CA - the container borrows the host's bundle.
      #
      # Mounting the directory rather than the single file on purpose: when the
      # host runs `update-ca-certificates` it writes a new file, and a
      # single-file bind mount would keep serving the old inode until the
      # container restarted.
      #
      # Override the host path if your distribution differs - RHEL and Fedora
      # keep it at /etc/pki/tls/certs. Careful: if the path does not exist,
      # Docker creates it as an empty directory and every TLS connection fails.
      - ${SABLE_HOST_CA_DIR:-/etc/ssl/certs}:/etc/ssl/certs:ro

    environment:
      # Redirect Python to the mounted bundle. Without this the mount above does
      # nothing: httpx verifies against its bundled certifi store, not the
      # system one, so the internal CA would never be consulted.
      #
      # This REPLACES the trust store rather than adding to it, which is why it
      # must point at the complete host bundle - public roots and your internal
      # CA together. Pointing it at a file holding only the internal CA makes
      # every public HTTPS call (your model backend, for one) fail instead.
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

      # ===================== REQUIRED =====================================
      # The shared secret, identical to the one given to
      # `occ talk:bot:install`. 40–128 characters: openssl rand -hex 32
      # Read from .env or the shell, so the value stays out of this file.
      SABLE_BOT_SECRET: "${SABLE_BOT_SECRET:?required — put it in .env (see docs/deployment.md)}"

      # ===================== Talk bot identity ============================
      # The secret being rotated away from — accepted on incoming webhooks and
      # never used to sign what sable sends. Talk holds one secret per install,
      # so a rotation is uninstall, install with the new value, restart, and
      # every event in that window would 401 without this. Same 40–128 range,
      # and it may not repeat the value above. Keep it in .env; clear it when
      # the rotation is done.
      # SABLE_BOT_SECRET_PREVIOUS: "${SABLE_BOT_SECRET_PREVIOUS:-}"

      # Your Nextcloud base URL, no trailing slash. Optional for the webhook
      # path — each signed event carries the server URL in a header — but
      # required for /notify, and without it backend pinning cannot run.
      # Strongly recommended.
      # SABLE_NEXTCLOUD_URL: "https://cloud.example.org"

      # Name mention detection matches on; keep it in step with the name you
      # installed the bot under.
      # SABLE_BOT_NAME: "sable"

      # Reject webhooks whose backend header is not SABLE_NEXTCLOUD_URL.
      # Ignored when no URL is set.
      # SABLE_PIN_BACKEND: "true"

      # ===================== Chat behaviour ===============================
      # SABLE_COMMAND_PREFIX: "!"

      # Conversations where every message goes to the model, no mention needed.
      # Conversation tokens (a1b2c3d4, the last part of the conversation's URL)
      # or display names (AI), or * for all. Empty = mentions and !ai only.
      # A token never changes; a moderator can rename a conversation.
      # SABLE_AI_ROOMS: "AI,a1b2c3d4"

      # Post answers as threaded replies to the triggering message.
      # SABLE_REPLY_AS_REPLY: "false"

      # Emoji to stick on a message while the model thinks; empty disables it.
      # SABLE_THINKING_REACTION: "👀"

      # React to any message with this and the bot answers that message, in a
      # reply threaded under it. Empty disables the feature and its message
      # cache. Needs --feature reaction on the bot install.
      # SABLE_ASK_REACTION: "⁉️"

      # Let only SABLE_ADMIN_USERS use that reaction. Otherwise anyone in the
      # room can forward somebody else's message to the model backend without
      # saying a word in the room. On with no SABLE_ADMIN_USERS is a startup
      # error — it would leave the feature usable by nobody.
      # SABLE_ASK_ADMINS_ONLY: "false"

      # Conversations whose messages are cached for that reaction — tokens or
      # display names, or "*", exactly like SABLE_AI_ROOMS.
      # MIND THE ASYMMETRY: empty here means EVERY conversation, where an empty
      # SABLE_AI_ROOMS means none. Deliberate — empty is what every deployment
      # already has, and reading it as "no rooms" would switch the reaction off
      # silently on upgrade. Naming the rooms that use it stops the others being
      # cached, which costs less memory and holds less chat content.
      # SABLE_ASK_ROOMS: "a1b2c3d4,Ops"

      # Messages remembered per conversation so a reaction can name one; a
      # reaction event carries the id, never the text. Expires with the history.
      # SABLE_MESSAGE_CACHE: "200"

      # Reply "I have no !foo command" on an unknown command.
      # SABLE_UNKNOWN_COMMAND_HINT: "true"

      # Post failures into the conversation as well as logging them.
      # SABLE_REPORT_ERRORS: "true"

      # Call Nextcloud's status.php at startup and log what answered, so a wrong
      # URL or an untrusted certificate shows up at boot. Never fatal.
      # SABLE_STARTUP_CHECK: "true"

      # Replies longer than this are clipped; Talk's own ceiling is 32000.
      # SABLE_MAX_MESSAGE_CHARS: "30000"

      # Model calls allowed in flight at once; "0" means no ceiling. Each
      # trigger is a background task with no limit of its own, so a busy room or
      # a burst of redelivered webhooks means that many completions open
      # together, each holding SABLE_LLM_TIMEOUT. Talk rate-limits the replies
      # sable sends, not the events it sends sable. Lower it for a local model
      # that serves one request at a time.
      # SABLE_MAX_CONCURRENT_REPLIES: "8"

      # Users to ignore completely - nothing they say or react to is acted on.
      # Matches a bare user id, a full actor id (users/alice) or a display name.
      # SABLE_IGNORE_USERS: "spammy-integration,users/alice"

      # ===================== Who may run which command ====================
      # Commands only SABLE_ADMIN_USERS may run; everything else stays open to
      # everyone in the conversation, guests included. "*" closes every command
      # and makes SABLE_NORMAL_COMMANDS the exceptions. Naming a command covers
      # its aliases, so "reset" also covers !forget.
      # SABLE_ADMIN_COMMANDS: "reset,ai"

      # The exceptions to SABLE_ADMIN_COMMANDS "*". Redundant otherwise.
      # SABLE_NORMAL_COMMANDS: "help,ping,whoami"

      # Nextcloud user ids allowed to run them - never display names, which
      # anybody can change to yours. Required once the list above is set.
      # SABLE_ADMIN_USERS: "maser,korren"

      # ===================== Conversation memory ==========================
      # In-process and lost on restart. A turn is a question plus its answer.
      # SABLE_HISTORY_TURNS: "12"

      # Seconds before a message ages out; 0 disables expiry.
      # SABLE_HISTORY_TTL: "3600"

      # ===================== The model ====================================
      # Any OpenAI /chat/completions-compatible endpoint. Recipes for Ollama,
      # vLLM, LiteLLM, OpenRouter and others: docs/configuration.md
      # SABLE_LLM_BASE_URL: "https://api.openai.com/v1"

      # Secret — keep the value in .env, not here.
      # SABLE_LLM_API_KEY: "${SABLE_LLM_API_KEY:-}"

      # THE ASSISTANT IS OFF UNTIL THIS IS SET. Commands work regardless.
      # SABLE_LLM_MODEL: "gpt-4o-mini"

      # SABLE_LLM_SYSTEM_PROMPT: "You are sable, a helpful assistant in a Nextcloud Talk chat room. Answer concisely. You may use Markdown."

      # Both omitted from the request when unset, so the backend's own
      # defaults apply. Some newer models reject an explicit temperature.
      # SABLE_LLM_TEMPERATURE: "0.2"
      # SABLE_LLM_MAX_TOKENS: "800"

      # Seconds to wait for a completion. Raise it for slow local models.
      # SABLE_LLM_TIMEOUT: "120"

      # JSON object merged into the request body last, for provider-specific
      # fields. Single-quote it so YAML does not read it as a mapping.
      # SABLE_LLM_EXTRA_BODY: '{"top_k": 40}'

      # ===================== Alerting endpoint ============================
      # Bearer token for POST /notify. EMPTY DISABLES THE ROUTE (404).
      # Unrelated to the bot secret — generate a separate value, in .env.
      # SABLE_NOTIFY_TOKEN: "${SABLE_NOTIFY_TOKEN:-}"

      # Aliases so callers never need conversation tokens.
      # SABLE_NOTIFY_ROOMS: "alerts=a1b2c3d4,deploys=e5f6g7h8"

      # ===================== Webhooks from other services =================
      # Services that cannot speak /notify's shape post to /hook/<name>.
      # Hook name to conversation: a token from the conversation's URL, or a
      # SABLE_NOTIFY_ROOMS alias. Not the room's name.
      # SABLE_HOOKS: "komodo=a1b2c3d4,grafana=e5f6g7h8"

      # One token per hook, in its own variable. Keep the values in .env.
      # SABLE_HOOK_TOKEN_KOMODO: "${SABLE_HOOK_TOKEN_KOMODO:-}"

      # Optional per-hook format string; without one the payload is rendered
      # generically. {dotted.path} is substituted from the payload.
      # SABLE_HOOK_TEMPLATE_KOMODO: "**{level}** {data.type}: {data.data.name}"

      # Largest webhook payload accepted, in bytes. Default 256 KiB.
      # SABLE_MAX_HOOK_BYTES: "262144"

      # ===================== File attachments =============================
      # The bot API cannot attach files, so /notify uploads them as an ordinary
      # Nextcloud user instead. Both empty = /notify stays text-only. This
      # account can read and write its own Files, so give it its own user and
      # keep the password in .env.
      # SABLE_NEXTCLOUD_USER: "sable-bot"
      # SABLE_NEXTCLOUD_PASSWORD: "${SABLE_NEXTCLOUD_PASSWORD:-}"

      # Folder in that user's Files where attachments land before sharing.
      # SABLE_UPLOAD_PATH: "/sable"

      # Largest attachment /notify accepts, in bytes. Default 25 MiB.
      # SABLE_MAX_UPLOAD_BYTES: "26214400"

      # ===================== The HTTP surface itself =======================
      # Serve FastAPI's schema at /openapi.json and its doc pages at /docs and
      # /redoc. Off by default - they describe every route and body shape to
      # whoever can reach us, and nothing needs them at runtime. Off means the
      # routes are gone (404), not protected (401).
      # SABLE_API_DOCS: "false"

      # Require this in an X-Health-Token header on GET /healthz. Empty leaves
      # the probe open, which is the default and what the image's healthcheck
      # expects - it reads this variable and sends the header when set, so
      # guarding the probe does not fail the container. Keep it in .env.
      # SABLE_HEALTH_TOKEN: "${SABLE_HEALTH_TOKEN:-}"

      # Proxies whose X-Forwarded-For and X-Forwarded-Proto are believed. The
      # default trusts loopback only, which is right when the proxy runs on the
      # host and reaches sable through the published port below.
      #
      # A PROXY IN ANOTHER CONTAINER IS NOT LOOPBACK. It arrives from the shared
      # network, so name that network or the proxy's address, or the forwarded
      # headers are ignored and the access log shows the bridge gateway:
      #   SABLE_TRUSTED_PROXIES: "172.17.0.0/16"
      # `docker network inspect <name>` prints the subnet to use. Set it to ""
      # to trust nobody. A range must have no host bits set and a hostname is
      # refused, since uvicorn would keep it as a literal that never matches.
      # SABLE_TRUSTED_PROXIES: "127.0.0.1,::1"

      # ===================== Process ======================================
      # Leave the bind address alone: it is the container's own interface,
      # and the ports mapping below decides what is reachable from outside.
      # SABLE_HOST: "0.0.0.0"

      # Changing this means changing the ports mapping below to match; the
      # image's healthcheck follows it on its own.
      # SABLE_PORT: "8080"

      # DEBUG also logs why a message was NOT acted on — the fastest way to
      # debug prefix and mention matching.
      # SABLE_LOG_LEVEL: "INFO"

      # The zone the assistant answers in, as an IANA name. Empty follows the
      # container clock, which is usually UTC. The model is told the date either
      # way; without it, questions about "right now" are answered from training
      # data.
      # SABLE_TIMEZONE: "America/New_York"

    ports:
      # Published to localhost only: put a TLS-terminating reverse proxy in
      # front of this. Nextcloud will not send webhooks to plain HTTP unless an
      # admin has allowed local/insecure remotes. See docs/deployment.md.
      #
      # If the proxy also runs in Docker, delete this block, share a network and
      # let it reach sable:8080 directly.
      - "127.0.0.1:8080:8080"
