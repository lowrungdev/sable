# sable — a Nextcloud Talk assistant that runs as an ordinary user account.
# Every setting is explained in docs/configuration.md; the comments here only say
# what it is for.
#
# Settings come from two places, and they stack: a .env file next to this one
# (optional, and the right home for secrets, since this file is meant to be
# committed) and the environment: block below, which OVERRIDES it.
#
# Only the three Nextcloud account settings (URL, USER, PASSWORD) are required.
# Every other variable is listed, commented out, showing its default.
#
# Quote every value. YAML would read {} as an empty mapping and a leading ! as a
# type tag, which is a parse error, and the default command prefix is exactly that.

services:
  sable:
    # Build from this checkout. To run a published release instead, delete these
    # two lines and use the image CI built (docs/deployment.md):
    #   image: forgejo.subversive.link/subversive/sable:0.9
    build: .
    image: sable:latest
    container_name: sable
    restart: unless-stopped

    # ===================== Container hardening ==============================
    # sable writes nothing to disk and needs no privileges, so the container is
    # given none (docs/deployment.md#container-hardening).
    #
    # A compromised process cannot plant or alter anything in the image.
    read_only: true
    tmpfs:
      # The one writable place, held in RAM. Multipart uploads to /notify spool
      # here, so it must stay larger than SABLE_MAX_UPLOAD_BYTES and counts
      # against mem_limit.
      - /tmp:size=256m
    # It listens on 8080 and makes outbound requests: no capabilities needed.
    cap_drop:
      - ALL
    # setuid binaries and the like cannot gain privileges.
    security_opt:
      - no-new-privileges:true
    # A runaway or a fork bomb stops well short of the host's limits.
    pids_limit: 256
    # mem_limit is the form plain `docker compose up` always honours. It must
    # cover the /tmp tmpfs above when full.
    mem_limit: 768m
    # No `init: true`: sable starts no child processes to reap.

    env_file:
      - path: .env
        required: false

    volumes:
      # ===================== TLS trust ====================================
      # The host's CA directory, read-only, so sable can verify a Nextcloud using
      # an internal or self-signed certificate. The directory, not the single
      # file: `update-ca-certificates` writes a new file, and a file bind mount
      # would keep the old inode. Override the host path if your distribution
      # differs (RHEL and Fedora: /etc/pki/tls/certs); a missing path becomes an
      # empty directory and every TLS connection fails.
      - ${SABLE_HOST_CA_DIR:-/etc/ssl/certs}:/etc/ssl/certs:ro

    environment:
      # Points Python at the mounted bundle (httpx would otherwise use certifi).
      # It REPLACES the trust store, so it must name the complete host bundle.
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

      # ===================== REQUIRED =====================================
      # sable is an ordinary Nextcloud user: create one, invite it to the
      # conversations it should be in, and give it an app password (Settings >
      # Security > Devices & sessions). All three are read from .env or the
      # shell, so the values stay out of this file.
      #
      # Base URL, no trailing slash. Plain http:// to a non-local host warns.
      SABLE_NEXTCLOUD_URL: "${SABLE_NEXTCLOUD_URL:?required — put it in .env (see docs/deployment.md)}"

      # The account's user id; also the name people @-mention.
      SABLE_NEXTCLOUD_USER: "${SABLE_NEXTCLOUD_USER:?required — put it in .env (see docs/deployment.md)}"

      # The app password, never the login password. It cannot be scoped, so use
      # an account that owns nothing else.
      SABLE_NEXTCLOUD_PASSWORD: "${SABLE_NEXTCLOUD_PASSWORD:?required — put it in .env (see docs/deployment.md)}"

      # ===================== Reading chat =================================
      # Seconds each long poll may wait (Talk holds one at most 60). Every poll
      # holds a request slot on Nextcloud per conversation.
      # SABLE_POLL_TIMEOUT: "30"

      # Seconds between looks at which conversations the account is in; at least 5.
      # SABLE_ROOM_REFRESH: "60"

      # ===================== Chat behaviour ===============================
      # SABLE_COMMAND_PREFIX: "!"

      # The conversations sable serves, as TOKENS (the last part of a
      # conversation's URL). EMPTY MEANS EVERY CONVERSATION THE ACCOUNT IS IN,
      # with a startup warning.
      # SABLE_ALLOWED_ROOMS: "a1b2c3d4,e5f6g7h8"

      # With the list above set, leave the group and public conversations that
      # are neither listed nor a /notify or /hook destination.
      # SABLE_LEAVE_UNLISTED_ROOMS: "false"

      # Conversations (tokens, or "*") where every message goes to the model.
      # SABLE_AI_ROOMS: "a1b2c3d4"

      # Nextcloud user ids allowed to make the model answer; the admins are
      # always included. EMPTY = EVERYONE.
      # SABLE_LLM_USERS: "alice,bob"

      # Triggers one person may set off per minute; "0" turns it off.
      # SABLE_RATE_LIMIT: "20"

      # Post answers as threaded replies to the triggering message.
      # SABLE_REPLY_AS_REPLY: "false"

      # Emoji to stick on a message while the model thinks; empty disables it.
      # SABLE_THINKING_REACTION: "👀"

      # React with this and the bot answers that message, threaded under it.
      # Empty disables the feature.
      # SABLE_ASK_REACTION: "⁉️"

      # Let only SABLE_ADMIN_USERS use that reaction.
      # SABLE_ASK_ADMINS_ONLY: "false"

      # Reply "I have no `foo` command. Try `!help`." on an unknown !foo.
      # SABLE_UNKNOWN_COMMAND_HINT: "true"

      # Post failures into the conversation as well as logging them.
      # SABLE_REPORT_ERRORS: "true"

      # Sign in at startup and log who Nextcloud says we are. Never fatal.
      # SABLE_STARTUP_CHECK: "true"

      # Replies longer than this are clipped; Talk's own ceiling is 32000.
      # SABLE_MAX_MESSAGE_CHARS: "30000"

      # Model calls allowed in flight at once; "0" means no ceiling.
      # SABLE_MAX_CONCURRENT_REPLIES: "8"

      # Replies allowed to WAIT for a slot once that ceiling is reached; past it
      # new work is dropped. "0" means nothing may wait.
      # SABLE_MAX_QUEUED_REPLIES: "20"

      # Users to ignore completely: a user id, a full actor id or a display name.
      # SABLE_IGNORE_USERS: "spammy-integration,users/alice"

      # ===================== Who may run which command ====================
      # Commands only SABLE_ADMIN_USERS may run, or "*" for all of them; the rest
      # stay open to everyone. Naming a command covers its aliases.
      # SABLE_ADMIN_COMMANDS: "reset,ai"

      # The exceptions to SABLE_ADMIN_COMMANDS "*". Redundant otherwise.
      # SABLE_NORMAL_COMMANDS: "help,ping,whoami"

      # Nextcloud user ids that may run them, never display names. Required once
      # the list above is set.
      # SABLE_ADMIN_USERS: "maser,korren"

      # ===================== Conversation memory ==========================
      # In-process and lost on restart. A turn is a question plus its answer.
      # SABLE_HISTORY_TURNS: "12"

      # Seconds before a message ages out; 0 disables expiry.
      # SABLE_HISTORY_TTL: "3600"

      # ===================== The model ====================================
      # Any OpenAI /chat/completions-compatible endpoint (recipes for Ollama,
      # vLLM, LiteLLM, OpenRouter and others: docs/configuration.md).
      # SABLE_LLM_BASE_URL: "https://api.openai.com/v1"

      # Secret — keep the value in .env, not here.
      # SABLE_LLM_API_KEY: "${SABLE_LLM_API_KEY:-}"

      # THE ASSISTANT IS OFF UNTIL THIS IS SET. Commands work regardless.
      # SABLE_LLM_MODEL: "gpt-4o-mini"

      # SABLE_LLM_SYSTEM_PROMPT: "You are sable, a helpful assistant in a Nextcloud Talk chat room. Answer concisely. You may use Markdown."

      # Both omitted from the request when unset.
      # SABLE_LLM_TEMPERATURE: "0.2"
      # SABLE_LLM_MAX_TOKENS: "800"

      # Seconds to wait for a completion. Raise it for slow local models.
      # SABLE_LLM_TIMEOUT: "120"

      # JSON object merged into the request body last. Single-quote it so YAML
      # does not read it as a mapping. It may not set stream or messages, nor the
      # tool keys (see SABLE_LLM_TOOL_ROOMS): a startup error.
      # SABLE_LLM_EXTRA_BODY: '{"top_k": 40}'

      # ===================== Tools ========================================
      # openai asks once and posts the answer. openwebui hands the tool loop to
      # Open WebUI, which runs tools with the API key's own permissions: give
      # that key an account of its own. Needs SABLE_LLM_BASE_URL ending in /api.
      # SABLE_LLM_BACKEND: "openwebui"

      # Workspace tools and MCP servers, as Open WebUI names them.
      # SABLE_LLM_TOOL_IDS: "server:mcp:1,server:mcp:2"

      # Open WebUI's built-ins: web_search, code_interpreter, image_generation,
      # memory.
      # SABLE_LLM_FEATURES: "web_search"

      # WHERE those two apply: conversation tokens, or "*". EMPTY = NOWHERE. Use
      # a dedicated room and set SABLE_LLM_USERS.
      # SABLE_LLM_TOOL_ROOMS: "e5f6g7h8"

      # Off uses one blocking request: no polling, and no built-in tools.
      # SABLE_LLM_BUILTIN_TOOLS: "true"

      # Seconds between checks while the loop runs.
      # SABLE_LLM_POLL_INTERVAL: "2.0"

      # Keep the conversation each question creates, instead of deleting it.
      # SABLE_LLM_KEEP_CHATS: "false"

      # Append what the answer cited.
      # SABLE_LLM_SHOW_SOURCES: "false"

      # ===================== Alerting endpoint ============================
      # Bearer token for POST /notify. EMPTY DISABLES THE ROUTE (404). Generate a
      # value of its own, in .env.
      # SABLE_NOTIFY_TOKEN: "${SABLE_NOTIFY_TOKEN:-}"

      # Aliases so callers never need conversation tokens.
      # SABLE_NOTIFY_ROOMS: "alerts=a1b2c3d4,deploys=e5f6g7h8"

      # ===================== Webhooks from other services =================
      # Hook name to conversation (a token or a SABLE_NOTIFY_ROOMS alias).
      # SABLE_HOOKS: "komodo=a1b2c3d4,grafana=e5f6g7h8"

      # One token per hook, in its own variable. Keep the values in .env.
      # SABLE_HOOK_TOKEN_KOMODO: "${SABLE_HOOK_TOKEN_KOMODO:-}"

      # Optional per-hook format string; {dotted.path} is substituted from the
      # payload.
      # SABLE_HOOK_TEMPLATE_KOMODO: "**{level}** {data.type}: {data.data.name}"

      # Largest webhook payload accepted, in bytes (256 KiB).
      # SABLE_MAX_HOOK_BYTES: "262144"

      # ===================== File attachments =============================
      # Folder in the account's Files where /notify attachments land.
      # SABLE_UPLOAD_PATH: "/sable"

      # Largest attachment /notify accepts, in bytes (25 MiB). It also sizes the
      # largest request body. Keep it below the /tmp tmpfs above.
      # SABLE_MAX_UPLOAD_BYTES: "26214400"

      # ===================== The HTTP surface itself =======================
      # Serve the generated schema at /openapi.json, /docs and /redoc. Off removes
      # the routes (404).
      # SABLE_API_DOCS: "false"

      # Require this in an X-Health-Token header on GET /healthz. Empty leaves it
      # open. The image's healthcheck sends it when set. Keep it in .env.
      # SABLE_HEALTH_TOKEN: "${SABLE_HEALTH_TOKEN:-}"

      # Proxies whose X-Forwarded-For and X-Forwarded-Proto are believed. The
      # default is loopback, right for a proxy on the host. A PROXY IN ANOTHER
      # CONTAINER IS NOT LOOPBACK: name its network or address
      # (`docker network inspect <name>` prints the subnet):
      #   SABLE_TRUSTED_PROXIES: "172.17.0.0/16"
      # "" trusts nobody.
      # SABLE_TRUSTED_PROXIES: "127.0.0.1,::1"

      # ===================== Process ======================================
      # Leave the bind address alone: it is the container's own interface, and
      # the ports mapping below decides what is reachable from outside.
      # SABLE_HOST: "0.0.0.0"

      # Changing this means changing the ports mapping below to match.
      # SABLE_PORT: "8080"

      # DEBUG also logs why a message was NOT acted on, and puts chat content in
      # the log.
      # SABLE_LOG_LEVEL: "INFO"

      # Log an access line for every successful GET /healthz (about 2,900 a day
      # from the image's healthcheck).
      # SABLE_LOG_HEALTH_CHECKS: "false"

      # The zone the assistant answers in, as an IANA name. Empty follows the
      # container clock, usually UTC.
      # SABLE_TIMEZONE: "America/New_York"

    ports:
      # Localhost only. Nextcloud never calls sable, so this port serves only
      # /notify, /hook and /healthz: put a TLS-terminating reverse proxy in front
      # of it if anything outside this host calls those (docs/deployment.md). If
      # the proxy also runs in Docker, delete this block and share a network.
      - "127.0.0.1:8080:8080"
