name: Tests

# Every push to dev and main, and every pull request into them. Not `release`:
# release.yml runs the same checks first thing on a push there and publishes only
# if they pass, so listing it here would just run the checks twice, side by side.
on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

jobs:
  test:
    runs-on: docker-cli
    steps:
      - name: Install the Subversive CAs and this job's tools
        run: |
          apt-get update && apt-get install -y ca-certificates python3 python3-venv
          echo "${{ secrets.SUBVERSIVE_INTERMEDIATE }}" > /usr/local/share/ca-certificates/subversive-inter-ca.crt
          echo "${{ secrets.SUBVERSIVE_ROOT }}" > /usr/local/share/ca-certificates/subversive-root-ca.crt
          update-ca-certificates

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run the checks
        run: sh .forgejo/ci.sh
