name: Tests

# Every push to a long-lived branch, and every pull request into one.
on:
  push:
    branches:
      - dev
      - main
      - release
  pull_request:
    branches:
      - dev
      - main

jobs:
  test:
    runs-on: docker-cli
    steps:
      - name: Install the Subversive CAs and this job's tools
        run: |
          apt-get update && apt-get install -y ca-certificates python3 python3-venv
          echo "${{ secrets.SUBVERSIVE_INTERMEDIATE }}" > /usr/local/share/ca-certificates/subversive-inter-ca.crt
          echo "${{ secrets.SUBVERSIVE_ROOT }}" > /usr/local/share/ca-certificates/subversive-root-ca.crt
          update-ca-certificates

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv and the locked dependencies
        run: |
          set -eu
          python3 --version
          python3 -m venv /tmp/uv
          /tmp/uv/bin/pip install --quiet uv==0.12.19
          /tmp/uv/bin/uv --version
          # --locked installs exactly what uv.lock pins, and fails if the lock
          # no longer matches pyproject.toml. The dev extra carries ruff and mypy.
          /tmp/uv/bin/uv sync --locked --extra dev

      - name: Lint
        run: /tmp/uv/bin/uv run --locked ruff check .

      - name: Check the formatting
        run: /tmp/uv/bin/uv run --locked ruff format --check .

      - name: Check the types
        run: /tmp/uv/bin/uv run --locked mypy

      - name: Run the test suite
        run: /tmp/uv/bin/uv run --locked pytest -q
