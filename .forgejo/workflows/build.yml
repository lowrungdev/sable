name: Manual build

# A button, nothing more. `dev` never builds by itself: come here, press
# "Run workflow", pick the branch.
#
# Anything built outside the release branch is published as `:dev` - one moving
# tag, never `:latest` and never a version number, and no Forgejo Release.
# Publishing is the release branch's job (see release.yml), which has its own
# button for rebuilding what is on `release`.
#
# `:dev` moves with every run, so to pin one of these images use the digest this
# job prints at the end.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: docker-cli
    env:
      IMAGE: forgejo.subversive.link/subversive/sable
    steps:
      - name: Install the Subversive CAs and this job's tools
        run: |
          apt-get update && apt-get install -y ca-certificates python3 python3-venv
          echo "${{ secrets.SUBVERSIVE_INTERMEDIATE }}" > /usr/local/share/ca-certificates/subversive-inter-ca.crt
          echo "${{ secrets.SUBVERSIVE_ROOT }}" > /usr/local/share/ca-certificates/subversive-root-ca.crt
          update-ca-certificates

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run the checks
        run: sh .forgejo/ci.sh

      - name: Log in to Forgejo Registry
        uses: docker/login-action@v3
        with:
          registry: forgejo.subversive.link
          username: rundeck_automation
          password: ${{ secrets.RUNDECK_KEY_VALUE }}

      - name: Build and push
        id: image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            forgejo.subversive.link/subversive/sable:dev
            forgejo.subversive.link/subversive/sable:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://forgejo.subversive.link/subversive/sable
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Summary
        run: |
          echo "Pushed $IMAGE:dev from ${{ github.ref_name }}"
          echo "  commit:   $IMAGE:${{ github.sha }}"
          echo "  digest:   ${{ steps.image.outputs.digest }}"
          echo "  pin with: $IMAGE@${{ steps.image.outputs.digest }}"
          echo "This is not a release: no version tag, no :latest, no Forgejo Release."
