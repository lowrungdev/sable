# Settings for the cert-check plugin. The file name pairs it with certcheck.py:
# <name>_settings.yaml. Reference: docs/plugins.md

enabled: true

access:
  # Conversation tokens (the last part of a conversation's URL), quoted. As shipped this is
  # empty, which keeps the plugin INACTIVE: sable validates it and never runs it.
  # REPLACE with your own, e.g.  rooms: ["a1b2c3d4"]
  # A room must also be in SABLE_ALLOWED_ROOMS, if that is set.
  rooms: []
  # Nextcloud user ids. Empty means anyone in the rooms above.
  users: []
  admins_only: false

# Handed to the plugin as ctx.settings. No credentials needed: this plugin only ever
# connects out, as a plain TLS client, to whatever host it's asked to check.
settings:
  # Warn (⚠️) at or under this many days left. The check still runs, and still replies,
  # above it - this only changes whether the reply is flagged.
  warn_days: 14
